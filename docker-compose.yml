services:
  lb:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet-tcp:046225b9a4b4a47089712298d094208b010e0377
    platform: linux/amd64
    entrypoint: ["rinha-lb"]
    environment:
      LB_MODE: fdpass
    ports:
      - "9999:9999"
    volumes:
      - backend-sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.12"
          memory: "32MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet-tcp:046225b9a4b4a47089712298d094208b010e0377
    platform: linux/amd64
    entrypoint: ["rinha-fraud", "serve"]
    environment:
      BIND_ADDR: fd:/sockets/api1.sock.ctrl
      INDEX_PATH: /app/data/references.idx
      INDEX_HUGEPAGES: "1"
      SERVER_MODE: raw-async
      FD_RAW: "1"
      FD_EPOLL: "1"
      FD_EPOLL_TIMEOUT_MS: "1"
      CLASSIFIER_PREWARM: "64"
      TP_PREWARM: "64"
      TP_MIN_THREADS: "64"
      TP_MIN_IO_THREADS: "4"
      WORKERS: "2"
      EARLY_CANDIDATES: "9800"
      MIN_CANDIDATES: "9800"
      MAX_CANDIDATES: "11000"
      PROFILE_FASTPATH: "1"
      PROFILE_FASTPATH_REFERENCE_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      EXPECTED_REFERENCES_GZIP_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      PROFILE_MIN_COUNT: "15"
      PROFILE_LEGIT_MIN_COUNT: "15"
      PROFILE_FRAUD_MIN_COUNT: "8"
      PROFILE_FRAUD_AMOUNT_MIN: "4000"
      PROFILE_FRAUD_LOW_AMOUNT_FASTPATH: "1"
      PROFILE_DOMINANT_FASTPATH: "0"
      PROFILE_DOMINANT_MIN_COUNT: "15"
      PROFILE_DOMINANT_MAX_OPPOSITE: "2"
      BUCKET_FASTPATH: "0"
      ASSUME_BODY_COMPLETE: "1"
      ASSUME_FRAUD_SCORE_PATH: "1"
      ASSUME_JSON_BODY_START: "1"
      FASTPATH_CANARY_REQUESTS: "0"
      FASTPATH_CANARY_INTERVAL: "0"
      EXACT_FALLBACK: "risky"
      EARLY_EDGE_FALLBACK: "1"
      RISKY_BUCKETS: "1"
      RISKY_AMOUNT_MIN: "400"
      RISKY_AMOUNT_MAX: "3000"
      RISKY_INSTALLMENTS_MIN: "2200"
      RISKY_INSTALLMENTS_MAX: "6200"
      RISKY_RATIO_MIN: "850"
      RISKY_KM_HOME_MIN: "250"
      RISKY_KM_HOME_MAX: "4000"
      RISKY_TX24H_MAX: "5800"
      RISKY_MERCHANT_AVG_MAX: "420"
      RISKY_NATIVE_FINE: "1"
      KDTREE_NATIVE: "1"
      DOTNET_EnableDiagnostics: "0"
    volumes:
      - backend-sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "156MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet-tcp:046225b9a4b4a47089712298d094208b010e0377
    platform: linux/amd64
    entrypoint: ["rinha-fraud", "serve"]
    environment:
      BIND_ADDR: fd:/sockets/api2.sock.ctrl
      INDEX_PATH: /app/data/references.idx
      INDEX_HUGEPAGES: "1"
      SERVER_MODE: raw-async
      FD_RAW: "1"
      FD_EPOLL: "1"
      FD_EPOLL_TIMEOUT_MS: "1"
      CLASSIFIER_PREWARM: "64"
      TP_PREWARM: "64"
      TP_MIN_THREADS: "64"
      TP_MIN_IO_THREADS: "4"
      WORKERS: "2"
      EARLY_CANDIDATES: "9800"
      MIN_CANDIDATES: "9800"
      MAX_CANDIDATES: "11000"
      PROFILE_FASTPATH: "1"
      PROFILE_FASTPATH_REFERENCE_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      EXPECTED_REFERENCES_GZIP_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      PROFILE_MIN_COUNT: "15"
      PROFILE_LEGIT_MIN_COUNT: "15"
      PROFILE_FRAUD_MIN_COUNT: "8"
      PROFILE_FRAUD_AMOUNT_MIN: "4000"
      PROFILE_FRAUD_LOW_AMOUNT_FASTPATH: "1"
      PROFILE_DOMINANT_FASTPATH: "0"
      PROFILE_DOMINANT_MIN_COUNT: "15"
      PROFILE_DOMINANT_MAX_OPPOSITE: "2"
      BUCKET_FASTPATH: "0"
      ASSUME_BODY_COMPLETE: "1"
      ASSUME_FRAUD_SCORE_PATH: "1"
      ASSUME_JSON_BODY_START: "1"
      FASTPATH_CANARY_REQUESTS: "0"
      FASTPATH_CANARY_INTERVAL: "0"
      EXACT_FALLBACK: "risky"
      EARLY_EDGE_FALLBACK: "1"
      RISKY_BUCKETS: "1"
      RISKY_AMOUNT_MIN: "400"
      RISKY_AMOUNT_MAX: "3000"
      RISKY_INSTALLMENTS_MIN: "2200"
      RISKY_INSTALLMENTS_MAX: "6200"
      RISKY_RATIO_MIN: "850"
      RISKY_KM_HOME_MIN: "250"
      RISKY_KM_HOME_MAX: "4000"
      RISKY_TX24H_MAX: "5800"
      RISKY_MERCHANT_AVG_MAX: "420"
      RISKY_NATIVE_FINE: "1"
      KDTREE_NATIVE: "1"
      DOTNET_EnableDiagnostics: "0"
    volumes:
      - backend-sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "156MB"

volumes:
  backend-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "true"
