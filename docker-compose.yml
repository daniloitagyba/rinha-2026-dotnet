services:
  lb:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:c597d55d82eb07a774605991ddfee0f31a786828
    platform: linux/amd64
    cpuset: "0,1,2,3"
    entrypoint: ["/entrypoint.sh"]
    environment:
      BIND_ADDR: "0.0.0.0:9999"
      TCP_EPOLL_RAW: "1"
      TCP_CLIENT_SETUP: "${TCP_CLIENT_SETUP:-0}"
      TCP_ACCEPT_BATCH: "${TCP_ACCEPT_BATCH:-64}"
      TCP_DEFER_ACCEPT: "${TCP_DEFER_ACCEPT:-1}"
      FD_EPOLL_TIMEOUT_MS: "${FD_EPOLL_TIMEOUT_MS:-1}"
      FD_EPOLL_SPIN_US: "${FD_EPOLL_SPIN_US:-20}"
      FD_EPOLL_IDLE_US: "${FD_EPOLL_IDLE_US:-20}"
      FD_EPOLL_BUSY_POLL_US: "${FD_EPOLL_BUSY_POLL_US:-0}"
      FD_EPOLL_BUSY_POLL_BUDGET: "${FD_EPOLL_BUSY_POLL_BUDGET:-8}"
      FD_EPOLL_PREFER_BUSY_POLL: "${FD_EPOLL_PREFER_BUSY_POLL:-1}"
      FD_CONN_POOL_CAP: "${FD_CONN_POOL_CAP:-512}"
      INDEX_PATH: /app/data/references.idx
      INDEX_HUGE: "${INDEX_HUGE:-1}"
      INDEX_HUGEPAGES: "1"
      INDEX_MLOCK: "${INDEX_MLOCK:-1}"
      INDEX_REPORT_HUGEPAGES: "${INDEX_REPORT_HUGEPAGES:-1}"
      PREFETCH_INDEX: "true"
      API_WARMUP_QUERIES: "${API_WARMUP_QUERIES:-4096}"
      API_WARMUP_JITTER: "${API_WARMUP_JITTER:-512}"
      WORKERS: "${API_WORKERS:-1}"
      KEEP_ALIVE_REQUESTS: "${KEEP_ALIVE_REQUESTS:-100000}"
      EARLY_CANDIDATES: "${EARLY_CANDIDATES:-4000}"
      MIN_CANDIDATES: "${MIN_CANDIDATES:-4000}"
      MAX_CANDIDATES: "${MAX_CANDIDATES:-8000}"
      PROFILE_FASTPATH: "${PROFILE_FASTPATH:-1}"
      PROFILE_FASTPATH_REFERENCE_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      EXPECTED_REFERENCES_GZIP_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      PROFILE_MIN_COUNT: "${PROFILE_MIN_COUNT:-15}"
      PROFILE_LEGIT_MIN_COUNT: "${PROFILE_LEGIT_MIN_COUNT:-15}"
      PROFILE_FRAUD_MIN_COUNT: "${PROFILE_FRAUD_MIN_COUNT:-25}"
      PROFILE_DOMINANT_FASTPATH: "${PROFILE_DOMINANT_FASTPATH:-0}"
      PROFILE_DOMINANT_MIN_COUNT: "${PROFILE_DOMINANT_MIN_COUNT:-15}"
      PROFILE_DOMINANT_MAX_OPPOSITE: "${PROFILE_DOMINANT_MAX_OPPOSITE:-2}"
      PROFILE_EXACT_TRIGGERS: "${PROFILE_EXACT_TRIGGERS:-0}"
      EXACT_FALLBACK: "${EXACT_FALLBACK:-off}"
      BUCKET_EXACT_FALLBACK: "${BUCKET_EXACT_FALLBACK:-0}"
      SELECTIVE_BUCKET_EXACT: "${SELECTIVE_BUCKET_EXACT:-1}"
      BUCKET_EXACT_WARM_CANDIDATES: "${BUCKET_EXACT_WARM_CANDIDATES:-0}"
      RISKY_SEMANTIC_GROUPS: "1"
      RISKY_SEMANTIC_RADIUS: "2"
      EARLY_EDGE_FALLBACK: "1"
      RISKY_AMOUNT_MIN: "350"
      RISKY_AMOUNT_MAX: "3200"
      RISKY_INSTALLMENTS_MIN: "2000"
      RISKY_INSTALLMENTS_MAX: "6500"
      RISKY_RATIO_MIN: "750"
      RISKY_KM_HOME_MIN: "200"
      RISKY_KM_HOME_MAX: "4300"
      RISKY_TX24H_MIN: "1500"
      RISKY_TX24H_MAX: "6000"
      RISKY_MERCHANT_AVG_MIN: "0"
      RISKY_MERCHANT_AVG_MAX: "450"
      OVERLOAD_MIN_CANDIDATES: "3000"
      OVERLOAD_MAX_CANDIDATES: "32400"
      OVERLOAD_THRESHOLD: "0"
      OVERLOAD_FAST_ONLY: "true"
      SEARCH_FALLBACK_LAST_DISTANCE: "2900"
      FAST_PATH: "false"
    ports:
      - "${HOST_PORT:-9999}:9999"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "${LB_CPU:-0.90}"
          memory: "320MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:c597d55d82eb07a774605991ddfee0f31a786828
    platform: linux/amd64
    cpuset: "0"
    entrypoint: ["sh", "-c", "sleep infinity"]
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.05}"
          memory: "12MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:c597d55d82eb07a774605991ddfee0f31a786828
    platform: linux/amd64
    cpuset: "2"
    entrypoint: ["sh", "-c", "sleep infinity"]
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.05}"
          memory: "12MB"

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"
