services:
  lb:
    image: haproxy:2.9-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet:a47df5cc1f396735044882a1c8f6487c7d05d13e
    platform: linux/amd64
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INDEX_PATH: /app/data/references.idx
      WORKERS: "1"
      EARLY_CANDIDATES: "14000"
      MIN_CANDIDATES: "20000"
      MAX_CANDIDATES: "40000"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "156MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet:a47df5cc1f396735044882a1c8f6487c7d05d13e
    platform: linux/amd64
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INDEX_PATH: /app/data/references.idx
      WORKERS: "1"
      EARLY_CANDIDATES: "14000"
      MIN_CANDIDATES: "20000"
      MAX_CANDIDATES: "40000"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "156MB"
