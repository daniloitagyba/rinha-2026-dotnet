services:
  lb:
    image: haproxy:2.9-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "32MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet:e70235ace86c5cf683da38928ef2172906ef2646
    platform: linux/amd64
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INDEX_PATH: /app/data/references.idx
      WORKERS: "1"
      EARLY_CANDIDATES: "16000"
      MIN_CANDIDATES: "22000"
      MAX_CANDIDATES: "44000"
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "156MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet:e70235ace86c5cf683da38928ef2172906ef2646
    platform: linux/amd64
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INDEX_PATH: /app/data/references.idx
      WORKERS: "1"
      EARLY_CANDIDATES: "16000"
      MIN_CANDIDATES: "22000"
      MAX_CANDIDATES: "44000"
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "156MB"
