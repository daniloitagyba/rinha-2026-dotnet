services:
  lb:
    image: haproxy:2.9-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "32MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet:e5935fcfe0d2f18040a5c64c0cfd9c15abdbfdae
    platform: linux/amd64
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INDEX_PATH: /app/data/references.idx
      WORKERS: "1"
      EARLY_CANDIDATES: "30000"
      MIN_CANDIDATES: "36000"
      MAX_CANDIDATES: "72000"
      PROFILE_FASTPATH: "1"
      PROFILE_MIN_COUNT: "20"
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "156MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-dotnet:e5935fcfe0d2f18040a5c64c0cfd9c15abdbfdae
    platform: linux/amd64
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INDEX_PATH: /app/data/references.idx
      WORKERS: "1"
      EARLY_CANDIDATES: "30000"
      MIN_CANDIDATES: "36000"
      MAX_CANDIDATES: "72000"
      PROFILE_FASTPATH: "1"
      PROFILE_MIN_COUNT: "20"
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "156MB"
